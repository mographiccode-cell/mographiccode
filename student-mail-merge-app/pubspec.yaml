name: student_mail_merge
description: Excel + Word student card mail merge app for Android and Windows.
publish_to: 'none'
version: 1.2.1+4

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^13.1.0
  excel_plus: ^2.22.0
  archive: ^4.3.0
  xml: ^7.0.1
  docx_creator: ^1.3.3
  htmltopdfwidgets: 2.1.1
  pdf: ^3.13.1
  printing: ^5.15.1
  path_provider: ^2.1.5
  path: ^1.9.1
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحميل منصة التعلم</title><style>body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial;background:#f5f7fb;color:#15233b;display:grid;place-items:center;min-height:100vh}.box{width:min(92vw,460px);background:#fff;border:1px solid #e5e9f2;border-radius:24px;padding:28px;text-align:center;box-shadow:0 16px 50px #243b6b18}.spin{width:44px;height:44px;margin:0 auto 18px;border:4px solid #dbe5ff;border-top-color:#315efb;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#65728a;line-height:1.8}</style></head><body><div class="box"><div class="spin"></div><h2>جاري تشغيل منصة التعلم…</h2><p>يتم تحميل المحتوى الأكاديمي، انتظر لحظات.</p></div><script>(async()=>{try{const base='https://raw.githubusercontent.com/mographiccode-cell/mographiccode/ai-network-course-host/ai-network-course-payload';const parts=await Promise.all(Array.from({length:7},(_,i)=>fetch(`${base}/chunk_${i+1}.txt`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})));const b64=parts.join('').replace(/\s+/g,'');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="box"><h2>تعذر تحميل الصفحة</h2><p>أعد المحاولة بعد لحظات.</p></div>';console.error(e)}})();</script></body></html>

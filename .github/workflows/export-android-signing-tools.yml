name: Export Android Signing Tools
# refresh 2026-09-26

on:
  workflow_dispatch:
  push:
    branches:
      - projectdesk-v13-staging
    paths:
      - '.github/workflows/export-android-signing-tools.yml'

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Locate signing tools
        shell: bash
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          BT_DIR=$(dirname "$APKSIGNER")
          echo "Build tools: $BT_DIR"
          mkdir -p /tmp/projectdesk-build-tools
          cp "$APKSIGNER" /tmp/projectdesk-build-tools/
          cp "$ZIPALIGN" /tmp/projectdesk-build-tools/
          cp -R "$BT_DIR/lib" /tmp/projectdesk-build-tools/
          chmod +x /tmp/projectdesk-build-tools/apksigner /tmp/projectdesk-build-tools/zipalign
          tar -czf android-signing-tools.tar.gz -C /tmp projectdesk-build-tools

      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-linux
          path: android-signing-tools.tar.gz
          if-no-files-found: error
          retention-days: 1

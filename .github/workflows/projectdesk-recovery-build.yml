name: Build ProjectDesk Recovery APK

on:
  push:
    branches:
      - projectdesk-v13-staging
    paths:
      - '.github/workflows/projectdesk-recovery-build.yml'
      - 'projectdesk_recovery_v2/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Recovery v2 source
        shell: bash
        run: |
          cat projectdesk_recovery_v2/source.part* > recovery.b64
          base64 --decode recovery.b64 > recovery.tar.xz
          echo "6179188936300469b838fb9d7599551cb4a7e91a3d39d46a7bde831b0dd3e707  recovery.tar.xz" | sha256sum -c -
          mkdir recovery_src
          tar -xJf recovery.tar.xz -C recovery_src
          test -f recovery_src/lib/main.dart
          test -f recovery_src/android_overlay/app/src/main/kotlin/com/mographikod/projectdesk_recovery/RecoveryAccessibilityService.kt
          test -f recovery_src/android_overlay/app/src/main/kotlin/com/mographikod/projectdesk_recovery/RecoveryBackupBuilder.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Create clean Android host and apply hotfix
        shell: bash
        run: |
          mkdir recovery_app
          cd recovery_app
          flutter create . --platforms=android --org com.mographikod --project-name projectdesk_recovery

          rm -rf lib
          cp -R ../recovery_src/lib .
          cp ../recovery_src/pubspec.yaml .
          sed -i '/dart:convert/d' lib/main.dart
          sed -i 's/^version:.*/version: 1.1.0+3/' pubspec.yaml
          rm -f analysis_options.yaml

          cp ../recovery_src/android_overlay/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/kotlin
          mkdir -p android/app/src/main/kotlin/com/mographikod/projectdesk_recovery
          cp ../recovery_src/android_overlay/app/src/main/kotlin/com/mographikod/projectdesk_recovery/*.kt android/app/src/main/kotlin/com/mographikod/projectdesk_recovery/

          sed -i 's/AccessibilityManager.FEEDBACK_ALL_MASK/android.accessibilityservice.AccessibilityServiceInfo.FEEDBACK_ALL_MASK/g' android/app/src/main/kotlin/com/mographikod/projectdesk_recovery/MainActivity.kt

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android/app/src/main/kotlin/com/mographikod/projectdesk_recovery")
          for p in root.glob("*.kt"):
              s = p.read_text()
              s = s.replace(
                  'execSQL("PRAGMA journal_mode=DELETE")',
                  'rawQuery("PRAGMA journal_mode=DELETE", null).use { it.moveToFirst() }',
              )
              p.write_text(s)

          p = root / "RecoveryAccessibilityService.kt"
          s = p.read_text()

          s = s.replace(
              'val descriptors = collectAllProjectDescriptors()\n                saveState("running", "تم العثور على ${descriptors.size} مشروع. بدأت القراءة…", descriptors.size, 0, "")',
              'val descriptors = collectAllProjectDescriptors()\n                if (descriptors.isEmpty()) {\n                    throw IllegalStateException("لم أستطع اكتشاف بطاقات المشاريع. افتح شاشة المشاريع وتأكد من ظهورها ثم أعد المحاولة")\n                }\n                saveState("running", "تم العثور على ${descriptors.size} مشروع. بدأت القراءة…", descriptors.size, 0, "")'
          )

          new_open = r'''    private fun openProject(target: ProjectDescriptor): Boolean {
        ensureProjectsScreen()
        scrollToStart()
        var stale = 0
        repeat(120) {
            checkCancelled()
            val root = rootInActiveWindow ?: return@repeat
            val cards = findProjectCards(root)
            val match = cards.firstOrNull { it.signature == target.signature }
                ?: cards.firstOrNull { normalize(it.shortTitle) == normalize(target.shortTitle) && normalize(it.studentHint) == normalize(target.studentHint) }
                ?: cards.firstOrNull { normalize(it.shortTitle) == normalize(target.shortTitle) }

            val titleNodes = findNodesByText(root, target.shortTitle)
            val exactTitle = titleNodes.firstOrNull { normalize(it.text?.toString().orEmpty()) == normalize(target.shortTitle) }
            val clicked = clickNode(exactTitle ?: match?.node)
            if (clicked) {
                if (waitUntil(7000) {
                        val r = rootInActiveWindow
                        r != null && containsText(r, "الملخص") && containsText(r, "التسليم")
                    }) return true
            }

            val scroll = findPrimaryScrollable(root)
            val moved = scroll?.performAction(AccessibilityNodeInfo.ACTION_SCROLL_FORWARD) == true
            stale = if (!moved) stale + 1 else 0
            if (stale >= 2) return false
            sleep(500)
        }
        return false
    }'''

          s, n = re.subn(
              r'    private fun openProject\(target: ProjectDescriptor\): Boolean \{.*?\n    \}\n\n    private fun extractCurrentProject',
              new_open + '\n\n    private fun extractCurrentProject',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit("openProject replacement failed")

          new_cards = r'''    private fun findProjectCards(root: AccessibilityNodeInfo): List<ProjectDescriptor> {
        val partNodes = mutableListOf<AccessibilityNodeInfo>()
        walk(root) { n ->
            val t = n.text?.toString()?.trim().orEmpty()
            if (t == "Part 1" || t == "Part 2") partNodes.add(n)
        }

        val out = mutableListOf<ProjectDescriptor>()
        val seen = mutableSetOf<String>()
        val noise = setOf(
            "المشاريع", "مشروع جديد", "إضافة مشروع", "الكل",
            "Part 1", "Part 2", "قيد التنفيذ", "تعديلات", "مكتمل",
            "AI", "ذكاء اصطناعي"
        )

        for (partNode in partNodes) {
            val partText = partNode.text?.toString()?.trim().orEmpty()
            var cursor: AccessibilityNodeInfo? = partNode.parent
            var card: AccessibilityNodeInfo? = null
            var texts: List<String> = emptyList()
            var depth = 0

            while (cursor != null && depth < 8) {
                val currentTexts = descendantTexts(cursor).filter { it.isNotBlank() }
                val meaningful = currentTexts.filterNot {
                    it in noise || statuses.contains(it) ||
                        it.matches(Regex("\\d{1,3}%")) ||
                        it.startsWith("تقدم ") ||
                        it.startsWith("عدد التعديلات")
                }
                val hasState = currentTexts.any { statuses.contains(it) || it.matches(Regex("\\d{1,3}%")) }
                val b = bounds(cursor)
                if (currentTexts.contains(partText) &&
                    meaningful.isNotEmpty() &&
                    (hasState || meaningful.size >= 2) &&
                    currentTexts.size <= 20 &&
                    b.width() > 120 && b.height() > 50) {
                    card = cursor
                    texts = currentTexts
                    break
                }
                cursor = cursor.parent
                depth++
            }

            val node = card ?: continue
            val candidates = texts.filterNot {
                it in noise || statuses.contains(it) ||
                    it.matches(Regex("\\d{1,3}%")) ||
                    it.startsWith("تقدم ") ||
                    it.startsWith("عدد التعديلات")
            }.filter { it.length in 2..180 }

            if (candidates.isEmpty()) continue
            val short = candidates.first()
            if (short in setOf("الكل", "Part 1", "Part 2")) continue

            val original = if (candidates.size >= 3) candidates[1] else ""
            val student = when {
                candidates.size >= 4 -> candidates[candidates.size - 2]
                candidates.size >= 2 -> candidates.last()
                else -> ""
            }
            val branch = if (candidates.size >= 4) candidates.last() else ""
            val status = texts.firstOrNull { statuses.contains(it) }.orEmpty()
            val progressText = texts.firstOrNull { it.matches(Regex("\\d{1,3}%")) }.orEmpty()
            val progress = progressText.removeSuffix("%").toIntOrNull() ?: 0
            val signature = listOf(short, original, student, branch, partText)
                .joinToString("|") { normalize(it) }

            if (seen.add(signature)) {
                out.add(
                    ProjectDescriptor(
                        node,
                        signature,
                        short,
                        original,
                        student,
                        branch,
                        if (partText.endsWith("2")) 2 else 1,
                        status.ifBlank { "جديد" },
                        progress,
                    )
                )
            }
        }
        return out.sortedBy { bounds(it.node).top }
    }'''

          s, n = re.subn(
              r'    private fun findProjectCards\(root: AccessibilityNodeInfo\): List<ProjectDescriptor> \{.*?\n    \}\n\n    private data class ProjectDescriptor',
              new_cards + '\n\n    private data class ProjectDescriptor',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit("findProjectCards replacement failed")
          p.write_text(s)

          p = root / "RecoveryBackupBuilder.kt"
          s = p.read_text()
          s = s.replace(
              'val projects = root.optJSONArray("projects") ?: throw IllegalArgumentException("ملف الاستعادة لا يحتوي مشاريع")',
              'val projects = root.optJSONArray("projects") ?: throw IllegalArgumentException("ملف الاستعادة لا يحتوي مشاريع")\n        if (projects.length() == 0) throw IllegalStateException("لم يتم استخراج أي مشروع. لن يتم إنشاء نسخة فارغة")'
          )
          p.write_text(s)

          p = root / "MainActivity.kt"
          s = p.read_text()
          s = s.replace(
              'if (data.isBlank()) result.error("NO_DATA", "لا توجد بيانات مستعادة", null)\n                        else result.success(RecoveryBackupBuilder.create(this, data).absolutePath)',
              'val prefs = getSharedPreferences(RecoveryAccessibilityService.PREFS, Context.MODE_PRIVATE)\n                        val recovered = prefs.getInt("recovered", 0)\n                        if (data.isBlank() || recovered <= 0) result.error("NO_DATA", "لم يتم استخراج أي مشروع. أعد عملية الاستعادة أولًا", null)\n                        else result.success(RecoveryBackupBuilder.create(this, data).absolutePath)'
          )
          p.write_text(s)
          PY

          mkdir -p android/app/src/main/res/xml
          cp ../recovery_src/android_overlay/app/src/main/res/xml/accessibility_service_config.xml android/app/src/main/res/xml/
          cp ../recovery_src/android_overlay/app/src/main/res/values/strings.xml android/app/src/main/res/values/strings.xml
          rm -f test/widget_test.dart

          grep -q 'version: 1.1.0+3' pubspec.yaml
          grep -q 'com.mographikod.projectdesk_recovery' android/app/build.gradle.kts
          grep -q 'RecoveryAccessibilityService' android/app/src/main/AndroidManifest.xml
          grep -q 'RecoveryBackupBuilder' android/app/src/main/kotlin/com/mographikod/projectdesk_recovery/MainActivity.kt
          if grep -R 'execSQL("PRAGMA journal_mode=DELETE")' android/app/src/main/kotlin/com/mographikod/projectdesk_recovery; then
            echo 'Old SQLite PRAGMA call still present'
            exit 1
          fi

      - name: Resolve dependencies
        working-directory: recovery_app
        run: flutter pub get

      - name: Static analysis
        working-directory: recovery_app
        run: flutter analyze

      - name: Build clean release APK
        working-directory: recovery_app
        run: flutter build apk --release

      - name: Verify package and version
        shell: bash
        run: |
          APK=recovery_app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKA=$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | head -1)
          test -n "$APKA"
          "$APKA" apk summary "$APK"
          APP_ID=$("$APKA" manifest application-id "$APK")
          VERSION_CODE=$("$APKA" manifest version-code "$APK")
          VERSION_NAME=$("$APKA" manifest version-name "$APK")
          echo "APP_ID=$APP_ID"
          echo "VERSION_CODE=$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME"
          test "$APP_ID" = "com.mographikod.projectdesk_recovery"
          test "$VERSION_CODE" = "3"
          test "$VERSION_NAME" = "1.1.0"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload clean APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectDesk-Recovery-v1.1.0-robust-pre-resign
          path: recovery_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3

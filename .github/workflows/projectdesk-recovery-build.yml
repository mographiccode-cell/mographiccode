name: Build ProjectDesk Recovery APK

on:
  push:
    branches:
      - projectdesk-v13-staging
    paths:
      - '.github/workflows/projectdesk-recovery-build.yml'
      - 'projectdesk_recovery/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore recovery source
        shell: bash
        run: |
          cat projectdesk_recovery/source.part* > recovery.b64
          base64 --decode recovery.b64 > recovery.tar.xz
          echo "6c6d59d08d968654e355ddb25d16980437d39a69025bae9ea26476dd61b4bd74  recovery.tar.xz" | sha256sum -c -
          mkdir recovery_src
          tar -xJf recovery.tar.xz -C recovery_src
          test -f recovery_src/lib/main.dart
          test -f recovery_src/android_overlay/app/src/main/kotlin/com/mographikod/projectdesk_recovery/RecoveryAccessibilityService.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Create Flutter Android host
        shell: bash
        run: |
          mkdir recovery_app
          cd recovery_app
          flutter create . --platforms=android --org com.mographikod --project-name projectdesk_recovery
          rm -rf lib
          cp -R ../recovery_src/lib .
          cp ../recovery_src/pubspec.yaml .
          rm -f analysis_options.yaml
          cp -R ../recovery_src/android_overlay/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/kotlin
          mkdir -p android/app/src/main/kotlin/com/mographikod/projectdesk_recovery
          cp ../recovery_src/android_overlay/app/src/main/kotlin/com/mographikod/projectdesk_recovery/*.kt android/app/src/main/kotlin/com/mographikod/projectdesk_recovery/
          mkdir -p android/app/src/main/res/xml
          cp ../recovery_src/android_overlay/app/src/main/res/xml/accessibility_service_config.xml android/app/src/main/res/xml/
          cp ../recovery_src/android_overlay/app/src/main/res/values/strings.xml android/app/src/main/res/values/strings.xml
          rm -f test/widget_test.dart
          grep -q "com.mographikod.projectdesk_recovery" android/app/build.gradle.kts
          grep -q "RecoveryAccessibilityService" android/app/src/main/AndroidManifest.xml
          grep -q "com.mographikod.projectdesk" android/app/src/main/res/xml/accessibility_service_config.xml

      - name: Resolve dependencies
        working-directory: recovery_app
        run: flutter pub get

      - name: Static analysis
        working-directory: recovery_app
        run: flutter analyze

      - name: Build release APK
        working-directory: recovery_app
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          test -s recovery_app/build/app/outputs/flutter-apk/app-release.apk
          unzip -t recovery_app/build/app/outputs/flutter-apk/app-release.apk >/dev/null
          sha256sum recovery_app/build/app/outputs/flutter-apk/app-release.apk
          ls -lh recovery_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectDesk-Recovery-v1.0-pre-resign
          path: recovery_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3

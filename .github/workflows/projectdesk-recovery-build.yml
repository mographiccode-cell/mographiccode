name: Build ProjectDesk Recovery APK

on:
  push:
    branches:
      - projectdesk-v13-staging
    paths:
      - '.github/workflows/projectdesk-recovery-build.yml'
      - 'projectdesk_recovery_v2/**'
      - 'projectdesk_recovery_v11/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Recovery source and v1.1 overlay
        shell: bash
        run: |
          cat projectdesk_recovery_v2/source.part* > recovery.b64
          base64 --decode recovery.b64 > recovery.tar.xz
          echo "6179188936300469b838fb9d7599551cb4a7e91a3d39d46a7bde831b0dd3e707  recovery.tar.xz" | sha256sum -c -
          mkdir recovery_src
          tar -xJf recovery.tar.xz -C recovery_src

          base64 --decode projectdesk_recovery_v11/overlay.b64 > recovery-v11-overlay.tar.xz
          echo "bf2491df83cadc5c87250ac3375c591b2b4c84f9c2abc9fa779dbd6f7716dffb  recovery-v11-overlay.tar.xz" | sha256sum -c -
          mkdir recovery_overlay
          tar -xJf recovery-v11-overlay.tar.xz -C recovery_overlay

          test -f recovery_overlay/lib/main.dart
          test -f recovery_overlay/android_overlay/app/src/main/kotlin/com/mographikod/projectdesk_recovery/RecoveryAccessibilityService.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Create clean Recovery v1.1 Android host
        shell: bash
        run: |
          mkdir recovery_app
          cd recovery_app
          flutter create . --platforms=android --org com.mographikod --project-name projectdesk_recovery

          rm -rf lib
          cp -R ../recovery_src/lib .
          cp ../recovery_src/pubspec.yaml .
          cp ../recovery_overlay/lib/main.dart lib/main.dart
          sed -i '/dart:convert/d' lib/main.dart
          sed -i 's/^version:.*/version: 1.1.0+3/' pubspec.yaml
          rm -f analysis_options.yaml

          cp ../recovery_src/android_overlay/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/kotlin
          mkdir -p android/app/src/main/kotlin/com/mographikod/projectdesk_recovery
          cp ../recovery_src/android_overlay/app/src/main/kotlin/com/mographikod/projectdesk_recovery/*.kt android/app/src/main/kotlin/com/mographikod/projectdesk_recovery/
          cp ../recovery_overlay/android_overlay/app/src/main/kotlin/com/mographikod/projectdesk_recovery/*.kt android/app/src/main/kotlin/com/mographikod/projectdesk_recovery/

          sed -i 's/AccessibilityManager.FEEDBACK_ALL_MASK/android.accessibilityservice.AccessibilityServiceInfo.FEEDBACK_ALL_MASK/g' android/app/src/main/kotlin/com/mographikod/projectdesk_recovery/MainActivity.kt

          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/app/src/main/kotlin/com/mographikod/projectdesk_recovery")
          for p in root.glob("*.kt"):
              s = p.read_text()
              s = s.replace(
                  'execSQL("PRAGMA journal_mode=DELETE")',
                  'rawQuery("PRAGMA journal_mode=DELETE", null).use { it.moveToFirst() }',
              )
              p.write_text(s)
          PY

          mkdir -p android/app/src/main/res/xml
          cp ../recovery_src/android_overlay/app/src/main/res/xml/accessibility_service_config.xml android/app/src/main/res/xml/
          cp ../recovery_src/android_overlay/app/src/main/res/values/strings.xml android/app/src/main/res/values/strings.xml
          rm -f test/widget_test.dart

          grep -q 'version: 1.1.0+3' pubspec.yaml
          grep -q 'findSimpleProjectCards' android/app/src/main/kotlin/com/mographikod/projectdesk_recovery/RecoveryAccessibilityService.kt
          grep -q 'isProjectsScreen' android/app/src/main/kotlin/com/mographikod/projectdesk_recovery/RecoveryAccessibilityService.kt
          grep -q 'NO_PROJECTS' android/app/src/main/kotlin/com/mographikod/projectdesk_recovery/MainActivity.kt
          ! grep -R 'execSQL("PRAGMA journal_mode=DELETE")' android/app/src/main/kotlin/com/mographikod/projectdesk_recovery

      - name: Resolve dependencies
        working-directory: recovery_app
        run: flutter pub get

      - name: Static analysis
        working-directory: recovery_app
        run: flutter analyze

      - name: Build release APK
        working-directory: recovery_app
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          APK=recovery_app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKA=$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | head -1)
          test -n "$APKA"
          APP_ID=$("$APKA" manifest application-id "$APK")
          VERSION_CODE=$("$APKA" manifest version-code "$APK")
          VERSION_NAME=$("$APKA" manifest version-name "$APK")
          echo "APP_ID=$APP_ID"
          echo "VERSION_CODE=$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME"
          test "$APP_ID" = "com.mographikod.projectdesk_recovery"
          test "$VERSION_CODE" = "3"
          test "$VERSION_NAME" = "1.1.0"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectDesk-Recovery-v1.1.0-compat-pre-resign
          path: recovery_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3

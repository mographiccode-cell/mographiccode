name: ProjectDesk v1.4 Validation Build

on:
  push:
    branches:
      - projectdesk-v13-staging
    paths:
      - '.github/workflows/projectdesk-v14-build.yml'
      - 'projectdesk_patch_v14/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore base source
        shell: bash
        run: |
          cat projectdesk_build/source.part* > base.b64
          base64 --decode base.b64 > base.tar.xz
          echo "87f823dc30bf6b91969c8d1d3d516e2496c80e9b192c17f5d6c70707ac9aa9ae  base.tar.xz" | sha256sum -c -
          tar -xJf base.tar.xz

      - name: Apply voice patch and fixes
        shell: bash
        run: |
          cat projectdesk_patch/voice.patch.part* > voice.b64
          base64 --decode voice.b64 > voice.tar.xz
          echo "55973338a07cdefe0d86710a4ae4640d83cfa0b0951063cd45a4abcda1d7b5cd  voice.tar.xz" | sha256sum -c -
          tar -xJf voice.tar.xz -C project_organizer_flutter
          python3 - <<'PY'
          from pathlib import Path
          root = Path('project_organizer_flutter')
          p = root / 'lib/widgets/voice_text_field.dart'
          s = p.read_text()
          s = s.replace('selection.start.clamp(0, text.length) : text.length', 'selection.start.clamp(0, text.length).toInt() : text.length')
          s = s.replace('selection.end.clamp(start, text.length) : start', 'selection.end.clamp(start, text.length).toInt() : start')
          p.write_text(s)
          for rel in [
              'lib/screens/ideas_screen.dart',
              'lib/screens/project_detail_screen.dart',
              'lib/screens/projects_screen.dart',
              'lib/screens/tasks_screen.dart',
          ]:
              p = root / rel
              p.write_text(p.read_text().replace('separatorBuilder: (_, __)', 'separatorBuilder: (_, _)'))
          p = root / 'lib/services/backup_service.dart'
          p.write_text(p.read_text().replace("import 'package:cross_file/cross_file.dart';\n", ''))
          p = root / 'lib/services/file_service.dart'
          s = p.read_text()
          if "import 'dart:convert';\n" not in s:
              s = s.replace("import 'dart:io';\n", "import 'dart:convert';\nimport 'dart:io';\n")
          s = s.replace('XmlDocument.parse(String.fromCharCodes(doc.content))', 'XmlDocument.parse(utf8.decode(doc.content as List<int>))')
          p.write_text(s)
          PY

      - name: Apply v1.3 full-workflow patch
        shell: bash
        run: |
          cat projectdesk_patch_v13/v13.part* > v13.b64
          base64 --decode v13.b64 > v13.tar.xz
          echo "abee93476a95fcbf81eab9f43f468f75c70750cce1d099490c65075c5268b5bf  v13.tar.xz" | sha256sum -c -
          tar -xJf v13.tar.xz -C project_organizer_flutter

      - name: Apply v1.4 tracking and UX patch
        shell: bash
        run: |
          cat projectdesk_patch_v14/diff.part* > v14.b64
          base64 --decode v14.b64 > v14.diff.xz
          echo "ff0cc30a6e7f8b5122d9efb9d4ecff2de9134aa2534ea0353ab35f201ce7ec64  v14.diff.xz" | sha256sum -c -
          xz -dc v14.diff.xz > v14.diff
          patch --batch -p5 -d project_organizer_flutter < v14.diff
          grep -q "version: 1.4.0+10" project_organizer_flutter/pubspec.yaml
          grep -q "version: 2" project_organizer_flutter/lib/services/database_service.dart
          grep -q "p1_tools" project_organizer_flutter/lib/services/database_service.dart
          grep -q "p2_run_file" project_organizer_flutter/lib/services/database_service.dart
          grep -q "Tab(text: 'Part 1')" project_organizer_flutter/lib/screens/project_detail_screen.dart
          grep -q "Tab(text: 'Part 2')" project_organizer_flutter/lib/screens/project_detail_screen.dart
          grep -q "ProjectTrackingSummary" project_organizer_flutter/lib/widgets/project_card.dart

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Regenerate Android host and restore voice integration
        shell: bash
        working-directory: project_organizer_flutter
        run: |
          mkdir -p /tmp/projectdesk-native /tmp/projectdesk-icons
          cp android/app/src/main/AndroidManifest.xml /tmp/projectdesk-native/AndroidManifest.xml
          cp android/app/src/main/kotlin/com/mographikod/projectdesk/MainActivity.kt /tmp/projectdesk-native/MainActivity.kt
          find android/app/src/main/res -path '*/mipmap-*/ic_launcher.png' -exec cp --parents {} /tmp/projectdesk-icons/ \; 2>/dev/null || true

          rm -rf android
          flutter create . --platforms=android --org com.mographikod --project-name project_organizer

          cp /tmp/projectdesk-native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/kotlin
          mkdir -p android/app/src/main/kotlin/com/mographikod/projectdesk
          cp /tmp/projectdesk-native/MainActivity.kt android/app/src/main/kotlin/com/mographikod/projectdesk/MainActivity.kt
          if [ -d /tmp/projectdesk-icons/android/app/src/main/res ]; then
            cp -rf /tmp/projectdesk-icons/android/app/src/main/res/mipmap-* android/app/src/main/res/ || true
          fi
          rm -f test/widget_test.dart

          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text().replace('com.mographikod.project_organizer', 'com.mographikod.projectdesk')
          p.write_text(s)
          PY

          grep -q "com.mographikod.projectdesk" android/app/build.gradle.kts
          grep -q "android.permission.RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          grep -q "keyboardLanguage" android/app/src/main/kotlin/com/mographikod/projectdesk/MainActivity.kt

      - name: Dependencies
        working-directory: project_organizer_flutter
        run: flutter pub get

      - name: Static analysis
        working-directory: project_organizer_flutter
        run: flutter analyze

      - name: Unit tests
        working-directory: project_organizer_flutter
        run: flutter test

      - name: Build release APK
        working-directory: project_organizer_flutter
        run: flutter build apk --release

      - name: Verify build
        shell: bash
        run: |
          test -s project_organizer_flutter/build/app/outputs/flutter-apk/app-release.apk
          sha256sum project_organizer_flutter/build/app/outputs/flutter-apk/app-release.apk
          ls -lh project_organizer_flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK for permanent resigning
        uses: actions/upload-artifact@v4
        with:
          name: ProjectDesk-v1.4-pre-resign-apk
          path: project_organizer_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 2

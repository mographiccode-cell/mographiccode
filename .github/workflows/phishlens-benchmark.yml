name: PhishLens adversarial benchmark

on:
  push:
    branches: [phishlens-lab-vercel]
    paths:
      - 'benchmarks/**'
      - '.github/workflows/phishlens-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: python -m pip install --quiet pyarrow scipy scikit-learn numpy
      - name: Probe PhreshPhish benchmark files
        run: python benchmarks/probe_phresh.py
      - name: Train and validate compact PhreshPhish URL model
        run: python benchmarks/train_url_model.py
      - name: Upload compact URL model
        uses: actions/upload-artifact@v4
        with:
          name: phresh-url-model
          path: url_model_export.json
      - name: Run rebuilt advanced fusion benchmark
        run: python benchmarks/advanced_fusion_benchmark.py
      - name: Run legacy pipeline benchmark for comparison
        run: python benchmarks/phishlens_benchmark.py

name: PhishLens adversarial benchmark

on:
  push:
    branches: [phishlens-lab-vercel]
    paths:
      - 'benchmarks/**'
      - '.github/workflows/phishlens-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 100-case adversarial benchmark
        run: python benchmarks/phishlens_benchmark.py

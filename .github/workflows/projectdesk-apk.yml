name: ProjectDesk Android APK

on:
  push:
    branches:
      - projectdesk-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Restore ProjectDesk source archive
        shell: bash
        run: |
          cat projectdesk_build/source.part* > projectdesk-source.b64
          base64 --decode projectdesk-source.b64 > projectdesk-source.tar.xz
          echo "87f823dc30bf6b91969c8d1d3d516e2496c80e9b192c17f5d6c70707ac9aa9ae  projectdesk-source.tar.xz" | sha256sum -c -
          tar -xJf projectdesk-source.tar.xz
          test -f project_organizer_flutter/pubspec.yaml
          test -f project_organizer_flutter/lib/main.dart

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Regenerate Android host files
        shell: bash
        working-directory: project_organizer_flutter
        run: |
          mkdir -p /tmp/projectdesk-icons
          find android/app/src/main/res -path '*/mipmap-*/ic_launcher.png' -exec cp --parents {} /tmp/projectdesk-icons/ \; 2>/dev/null || true
          rm -rf android
          flutter create . --platforms=android --org com.mographikod --project-name project_organizer
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />')
          s = s.replace('android:label="project_organizer"', 'android:label="منظّم المشاريع"')
          if 'android:allowBackup=' not in s:
              s = s.replace('<application\n', '<application\n        android:allowBackup="false"\n        android:usesCleartextTraffic="false"\n', 1)
          p.write_text(s)
          PY
          if [ -d /tmp/projectdesk-icons/android/app/src/main/res ]; then
            cp -rf /tmp/projectdesk-icons/android/app/src/main/res/mipmap-* android/app/src/main/res/ || true
          fi

      - name: Resolve dependencies
        working-directory: project_organizer_flutter
        run: flutter pub get

      - name: Static analysis
        continue-on-error: true
        working-directory: project_organizer_flutter
        run: flutter analyze

      - name: Unit tests
        continue-on-error: true
        working-directory: project_organizer_flutter
        run: flutter test

      - name: Build release APK
        working-directory: project_organizer_flutter
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          test -s project_organizer_flutter/build/app/outputs/flutter-apk/app-release.apk
          sha256sum project_organizer_flutter/build/app/outputs/flutter-apk/app-release.apk
          ls -lh project_organizer_flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectDesk-release-apk
          path: project_organizer_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

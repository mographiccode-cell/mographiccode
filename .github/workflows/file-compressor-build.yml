name: File Compressor APK

on:
  push:
    branches: [ artifact/file-compressor-flutter-20260830 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-compressor-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.47
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Rebuild updated source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf file_compressor /tmp/file-compressor-v11 source_v11.b64 source_v11.zip
          cat build_assets/file_compressor_src_v11.part1 \
              build_assets/file_compressor_src_v11.part2 \
              build_assets/file_compressor_src_v11.part3 \
              build_assets/file_compressor_src_v11.part4 > source_v11.b64
          base64 -d source_v11.b64 > source_v11.zip
          unzip -q source_v11.zip -d /tmp/file-compressor-v11
          SRC=/tmp/file-compressor-v11/file_compressor_flutter

          flutter create --platforms=android,ios --org com.mographiccode --project-name file_compressor file_compressor
          rm -rf file_compressor/lib file_compressor/test file_compressor/assets
          cp -a "$SRC/lib" file_compressor/lib
          cp -a "$SRC/test" file_compressor/test
          cp -a "$SRC/assets" file_compressor/assets
          cp "$SRC/pubspec.yaml" file_compressor/pubspec.yaml
          cp "$SRC/analysis_options.yaml" file_compressor/analysis_options.yaml
          cp "$SRC/README.md" file_compressor/README.md

          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('file_compressor/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="file_compressor"', 'android:label="ضاغط الملفات"')
          manifest.write_text(text)
          info = Path('file_compressor/ios/Runner/Info.plist')
          text = info.read_text()
          text = text.replace('<string>file_compressor</string>', '<string>ضاغط الملفات</string>', 1)
          info.write_text(text)
          PY

      - name: Generate launcher icon
        working-directory: file_compressor
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart run flutter_launcher_icons

      - name: Analyze and test
        working-directory: file_compressor
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          flutter analyze --fatal-infos
          flutter test

      - name: Build release APK
        working-directory: file_compressor
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/File-Compressor-v1.1.0.apk

      - name: APK metadata
        working-directory: file_compressor
        shell: bash
        run: |
          set -euo pipefail
          sha256sum build/app/outputs/flutter-apk/File-Compressor-v1.1.0.apk | tee APK_SHA256.txt
          stat -c '%s bytes' build/app/outputs/flutter-apk/File-Compressor-v1.1.0.apk | tee APK_SIZE.txt

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: file-compressor-v1-1-release-apk
          path: |
            file_compressor/build/app/outputs/flutter-apk/File-Compressor-v1.1.0.apk
            file_compressor/APK_SHA256.txt
            file_compressor/APK_SIZE.txt
          if-no-files-found: error
          retention-days: 14

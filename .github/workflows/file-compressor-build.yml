name: File Compressor APK

on:
  push:
    branches: [ artifact/file-compressor-flutter-20260830 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-compressor-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.47
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Restore verified v1.2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf file_compressor
          flutter create --platforms=android,ios --org com.mographiccode --project-name file_compressor file_compressor
          mkdir -p file_compressor/lib file_compressor/assets file_compressor/test

          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re, hashlib

          main_parts = [
              ('build_assets/v12_main.part1', '449c1fc50684a5e2c67e5c5e33ff61e9bdf015d214902aa11db0e62d9c7244a9'),
              ('build_assets/v12_main.part2', 'ae3385c924fab2f2d3a34f9f01873b6d49286ad901a5e7852ce7d0683b18ade4'),
              ('build_assets/v12_main.part3', '9a9bab55fc47c4e89d0f72f4aed2490331b19319e0df774f930f415a7a06f9b2'),
              ('build_assets/v12_main.part4', '62bb22bb131cd234b33707d3afb3aca20651c4de99102c5175097e02e998af82'),
              ('build_assets/v12_main.part5', '34c6058ade92fc01c7d221c3fa831c1b85ddde19ff7ffe9704ae4aac50676957'),
          ]
          for path, expected in main_parts:
              data = Path(path).read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise RuntimeError(f'Chunk checksum mismatch: {path}: {actual}')

          def clean_b64(paths):
              raw = ''.join(Path(p).read_text() for p in paths)
              return re.sub(r'[^A-Za-z0-9+/=]', '', raw)

          main_b64 = clean_b64([p for p, _ in main_parts])
          Path('file_compressor/lib/main.dart').write_bytes(gzip.decompress(base64.b64decode(main_b64)))

          icon_b64 = clean_b64(['build_assets/v11_icon_128.b64'])
          Path('file_compressor/assets/app_icon.jpg').write_bytes(base64.b64decode(icon_b64))

          pub_b64 = clean_b64(['build_assets/v11_pubspec.b64'])
          Path('file_compressor/pubspec.yaml').write_bytes(gzip.decompress(base64.b64decode(pub_b64)))
          PY

          cat > file_compressor/analysis_options.yaml <<'EOF'
          include: package:flutter_lints/flutter.yaml
          EOF

          cat > file_compressor/test/widget_test.dart <<'EOF'
          import 'package:file_compressor/main.dart';
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('formatBytes formats values', () {
              expect(formatBytes(1024), '1.0 KB');
              expect(formatBytes(1048576), '1.0 MB');
            });
          }
          EOF

          echo '8f5b4e371f25b56546086358f5025e7d6777918bb22f86931b1ec04074bd693f  file_compressor/lib/main.dart' | sha256sum -c -
          echo '47cdb07f289e70966a26331923c78c1869950155a68fcdd08d5eadcaefda2ed2  file_compressor/pubspec.yaml' | sha256sum -c -
          test "$(head -c 2 file_compressor/assets/app_icon.jpg | od -An -tx1 | tr -d ' \n')" = 'ffd8'
          test "$(tail -c 2 file_compressor/assets/app_icon.jpg | od -An -tx1 | tr -d ' \n')" = 'ffd9'
          file file_compressor/assets/app_icon.jpg

          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('file_compressor/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="file_compressor"', 'android:label="ضاغط الملفات"')
          manifest.write_text(text)
          info = Path('file_compressor/ios/Runner/Info.plist')
          text = info.read_text()
          text = text.replace('<string>file_compressor</string>', '<string>ضاغط الملفات</string>', 1)
          info.write_text(text)
          PY

      - name: Generate and verify launcher icon
        working-directory: file_compressor
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart run flutter_launcher_icons
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          grep -q '@mipmap/ic_launcher' android/app/src/main/AndroidManifest.xml

      - name: Analyze and test
        working-directory: file_compressor
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build release APK
        working-directory: file_compressor
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/File-Compressor-v1.2.0.apk

      - name: APK metadata
        working-directory: file_compressor
        shell: bash
        run: |
          set -euo pipefail
          sha256sum build/app/outputs/flutter-apk/File-Compressor-v1.2.0.apk | tee APK_SHA256.txt
          stat -c '%s bytes' build/app/outputs/flutter-apk/File-Compressor-v1.2.0.apk | tee APK_SIZE.txt

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: file-compressor-v1-2-release-apk
          path: |
            file_compressor/build/app/outputs/flutter-apk/File-Compressor-v1.2.0.apk
            file_compressor/APK_SHA256.txt
            file_compressor/APK_SIZE.txt
          if-no-files-found: error
          retention-days: 14

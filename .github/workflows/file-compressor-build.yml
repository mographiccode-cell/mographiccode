name: File Compressor APK

on:
  push:
    branches: [ artifact/file-compressor-flutter-20260830 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-compressor-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.47
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Create mobile project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/file-compressor-src file_compressor
          mkdir -p /tmp/file-compressor-src
          unzip -q file_compressor_src.zip -d /tmp/file-compressor-src
          SRC=/tmp/file-compressor-src/file_compressor_flutter
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('/tmp/file-compressor-src/file_compressor_flutter/lib/main.dart')
          s = p.read_text()
          s = s.replace("import 'package:cross_file/cross_file.dart';\n", '')
          s = s.replace("final picked = await FilePicker.platform.pickFiles(\n      allowMultiple: true,\n      type: FileType.any,\n      withData: false,\n    );\n    if (picked == null) return;\n\n    final paths = picked.files\n", "final picked = await FilePicker.pickFiles(type: FileType.any);\n    if (picked.isEmpty) return;\n\n    final paths = picked\n")
          s = s.replace("final picked = await FilePicker.platform.pickFiles(\n      allowMultiple: false,\n      type: FileType.any,\n      withData: false,\n    );\n    if (picked == null || picked.files.single.path == null) return;\n\n    final archivePath = picked.files.single.path!;", "final picked = await FilePicker.pickFile(type: FileType.any);\n    if (picked == null || picked.path == null) return;\n\n    final archivePath = picked.path!;")
          lines = []
          for line in s.splitlines():
              match = re.match(r'^(\s*)if \((.*)\) ([^{].*;)$', line)
              if match:
                  indent, condition, statement = match.groups()
                  lines.extend([f'{indent}if ({condition}) {{', f'{indent}  {statement}', f'{indent}}}'])
              else:
                  lines.append(line)
          p.write_text('\n'.join(lines) + '\n')
          PY
          flutter create --platforms=android,ios --org com.mographiccode --project-name file_compressor file_compressor
          rm -rf file_compressor/lib file_compressor/test
          cp -a "$SRC/lib" file_compressor/lib
          cp -a "$SRC/test" file_compressor/test
          cp "$SRC/pubspec.yaml" file_compressor/pubspec.yaml
          cp "$SRC/analysis_options.yaml" file_compressor/analysis_options.yaml
          cp "$SRC/README.md" file_compressor/README.md
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('file_compressor/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="file_compressor"', 'android:label="ضاغط الملفات"')
          manifest.write_text(text)
          info = Path('file_compressor/ios/Runner/Info.plist')
          text = info.read_text()
          text = text.replace('<string>file_compressor</string>', '<string>ضاغط الملفات</string>', 1)
          info.write_text(text)
          PY

      - name: Analyze and test
        working-directory: file_compressor
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test
          flutter analyze --fatal-infos
          flutter test

      - name: Build release APK
        working-directory: file_compressor
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/File-Compressor.apk

      - name: APK metadata
        working-directory: file_compressor
        shell: bash
        run: |
          set -euo pipefail
          sha256sum build/app/outputs/flutter-apk/File-Compressor.apk | tee APK_SHA256.txt
          stat -c '%s bytes' build/app/outputs/flutter-apk/File-Compressor.apk | tee APK_SIZE.txt

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: file-compressor-release-apk
          path: |
            file_compressor/build/app/outputs/flutter-apk/File-Compressor.apk
            file_compressor/APK_SHA256.txt
            file_compressor/APK_SIZE.txt
          if-no-files-found: error
          retention-days: 14

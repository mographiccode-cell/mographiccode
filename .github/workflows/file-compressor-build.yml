name: File Compressor APK

on:
  push:
    branches: [ artifact/file-compressor-flutter-20260830 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-compressor-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.47
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Restore verified v1.1 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf file_compressor
          flutter create --platforms=android,ios --org com.mographiccode --project-name file_compressor file_compressor

          mkdir -p file_compressor/lib file_compressor/assets file_compressor/test
          cat build_assets/v11_main.part1 build_assets/v11_main.part2 | base64 -d | gzip -d > file_compressor/lib/main.dart
          cat build_assets/v11_icon.part1 build_assets/v11_icon.part2 | base64 -d > file_compressor/assets/app_icon.jpg
          base64 -d build_assets/v11_pubspec.b64 | gzip -d > file_compressor/pubspec.yaml

          cat > file_compressor/analysis_options.yaml <<'EOF'
          include: package:flutter_lints/flutter.yaml
          EOF

          cat > file_compressor/test/widget_test.dart <<'EOF'
          import 'package:file_compressor/main.dart';
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('formatBytes formats values', () {
              expect(formatBytes(1024), '1.0 KB');
              expect(formatBytes(1048576), '1.0 MB');
            });
          }
          EOF

          echo '9e458550808bbea2e9e8749db5f3f5c9df00e34e67b77cc05ea4488b03ec48aa  file_compressor/lib/main.dart' | sha256sum -c -
          echo 'e0ca39b2cb166b33850dba9ecb6205c4da3334a32514e2c42b9e4932f397af32  file_compressor/assets/app_icon.jpg' | sha256sum -c -
          echo 'ac880a7e7cd3369624f8e3d6e26fb0a38c6cba3f4055b0ce22f3155fb79a03ba  file_compressor/pubspec.yaml' | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('file_compressor/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="file_compressor"', 'android:label="ضاغط الملفات"')
          manifest.write_text(text)
          info = Path('file_compressor/ios/Runner/Info.plist')
          text = info.read_text()
          text = text.replace('<string>file_compressor</string>', '<string>ضاغط الملفات</string>', 1)
          info.write_text(text)
          PY

      - name: Generate launcher icon
        working-directory: file_compressor
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart run flutter_launcher_icons

      - name: Analyze and test
        working-directory: file_compressor
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          flutter analyze --fatal-infos
          flutter test

      - name: Build release APK
        working-directory: file_compressor
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/File-Compressor-v1.1.0.apk

      - name: APK metadata
        working-directory: file_compressor
        shell: bash
        run: |
          set -euo pipefail
          sha256sum build/app/outputs/flutter-apk/File-Compressor-v1.1.0.apk | tee APK_SHA256.txt
          stat -c '%s bytes' build/app/outputs/flutter-apk/File-Compressor-v1.1.0.apk | tee APK_SIZE.txt

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: file-compressor-v1-1-release-apk
          path: |
            file_compressor/build/app/outputs/flutter-apk/File-Compressor-v1.1.0.apk
            file_compressor/APK_SHA256.txt
            file_compressor/APK_SIZE.txt
          if-no-files-found: error
          retention-days: 14

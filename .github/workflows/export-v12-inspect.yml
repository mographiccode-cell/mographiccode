name: Export ProjectDesk v1.2 Source
on:
  push:
    branches:
      - projectdesk-v13-staging
    paths:
      - '.github/workflows/export-v12-inspect.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore
        shell: bash
        run: |
          cat projectdesk_build/source.part* > base.b64
          base64 --decode base.b64 > base.tar.xz
          tar -xJf base.tar.xz
          cat projectdesk_patch/voice.patch.part* > voice.b64
          base64 --decode voice.b64 > voice.tar.xz
          tar -xJf voice.tar.xz -C project_organizer_flutter
          python3 - <<'PY'
          from pathlib import Path
          root=Path('project_organizer_flutter')
          p=root/'lib/widgets/voice_text_field.dart'
          s=p.read_text().replace('selection.start.clamp(0, text.length) : text.length','selection.start.clamp(0, text.length).toInt() : text.length').replace('selection.end.clamp(start, text.length) : start','selection.end.clamp(start, text.length).toInt() : start')
          p.write_text(s)
          for rel in ['lib/screens/ideas_screen.dart','lib/screens/project_detail_screen.dart','lib/screens/projects_screen.dart','lib/screens/tasks_screen.dart']:
              p=root/rel; p.write_text(p.read_text().replace('separatorBuilder: (_, __)','separatorBuilder: (_, _)'))
          p=root/'lib/services/backup_service.dart'; p.write_text(p.read_text().replace("import 'package:cross_file/cross_file.dart';\n",''))
          p=root/'lib/services/file_service.dart'; s=p.read_text()
          if "import 'dart:convert';\n" not in s: s=s.replace("import 'dart:io';\n","import 'dart:convert';\nimport 'dart:io';\n")
          s=s.replace('XmlDocument.parse(String.fromCharCodes(doc.content))','XmlDocument.parse(utf8.decode(doc.content as List<int>))'); p.write_text(s)
          PY
          cat projectdesk_patch_v12/simple.patch.part* > v12.b64
          base64 --decode v12.b64 > v12.tar.xz
          echo "e5ba0ec995281baca48b7b8b91ca588785b7b8724a117dd832afcc1cca15b32f  v12.tar.xz" | sha256sum -c -
          tar -xJf v12.tar.xz -C project_organizer_flutter
          tar -czf ProjectDesk-v1.2-source.tar.gz project_organizer_flutter
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectDesk-v1.2-source-inspect
          path: ProjectDesk-v1.2-source.tar.gz
          retention-days: 1

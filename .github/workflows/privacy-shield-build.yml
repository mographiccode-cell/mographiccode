name: Privacy Shield Android Build

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: privacy-shield-apk-pr
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter 3.47
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Fetch Privacy Shield source
        shell: bash
        run: |
          git fetch origin privacy-shield-ci
          rm -rf /tmp/privacy-ci-src privacy_shield
          git worktree add --detach /tmp/privacy-ci-src origin/privacy-shield-ci

      - name: Generate Android shell
        shell: bash
        run: |
          flutter create --platforms=android --org com.privacyshield --project-name privacy_shield privacy_shield
          cp -a /tmp/privacy-ci-src/privacy_shield_src/. privacy_shield/
          cd privacy_shield
          rm -f test/widget_test.dart
          mkdir -p android/app/src/main/kotlin/com/privacyshield/privacy_shield
          mkdir -p android/app/src/main/res/xml
          cp native/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp native/android/kotlin/*.kt android/app/src/main/kotlin/com/privacyshield/privacy_shield/
          cp native/android/res/xml/*.xml android/app/src/main/res/xml/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 31')
          p.write_text(s)
          PY

      - name: Flutter pub get
        working-directory: privacy_shield
        run: flutter pub get

      - name: Format
        working-directory: privacy_shield
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: privacy_shield
        run: flutter analyze --fatal-infos

      - name: Unit tests
        working-directory: privacy_shield
        run: flutter test

      - name: Verify self has no sensor permissions
        working-directory: privacy_shield
        shell: bash
        run: |
          ! grep -q '<uses-permission android:name="android.permission.CAMERA"' android/app/src/main/AndroidManifest.xml
          ! grep -q '<uses-permission android:name="android.permission.RECORD_AUDIO"' android/app/src/main/AndroidManifest.xml
          ! grep -q '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"' android/app/src/main/AndroidManifest.xml
          ! grep -q '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: privacy_shield
        run: flutter build apk --debug

      - name: APK metadata
        working-directory: privacy_shield
        shell: bash
        run: |
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee APK_SHA256.txt
          stat -c '%s bytes' build/app/outputs/flutter-apk/app-debug.apk | tee APK_SIZE.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: privacy-shield-apk
          path: |
            privacy_shield/build/app/outputs/flutter-apk/app-debug.apk
            privacy_shield/APK_SHA256.txt
            privacy_shield/APK_SIZE.txt
          if-no-files-found: error
          retention-days: 7

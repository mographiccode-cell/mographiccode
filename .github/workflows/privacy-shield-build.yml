name: Privacy Shield Android Build

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter 3.47
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Build, analyze and test
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git fetch origin privacy-shield-ci
          rm -rf /tmp/privacy-ci-src privacy_shield
          git worktree add --detach /tmp/privacy-ci-src origin/privacy-shield-ci
          (
            set -euo pipefail
            echo '=== TOOLCHAIN ==='
            flutter --version
            echo '=== GENERATE ANDROID SHELL ==='
            flutter create --platforms=android --org com.privacyshield --project-name privacy_shield privacy_shield
            echo '=== COPY SOURCE TREE ==='
            cp -a /tmp/privacy-ci-src/privacy_shield_src/. privacy_shield/
            cd privacy_shield
            rm -f test/widget_test.dart
            mkdir -p android/app/src/main/kotlin/com/privacyshield/privacy_shield
            mkdir -p android/app/src/main/res/xml
            cp native/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            cp native/android/kotlin/*.kt android/app/src/main/kotlin/com/privacyshield/privacy_shield/
            cp native/android/res/xml/*.xml android/app/src/main/res/xml/
            python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 31')
          p.write_text(s)
          PY
            echo '=== PUB GET ==='
            flutter pub get
            echo '=== FORMAT ==='
            dart format lib test
            echo '=== ANALYZE ==='
            flutter analyze --fatal-infos
            echo '=== TEST ==='
            flutter test
            echo '=== SELF SENSOR PERMISSION CHECK ==='
            ! grep -q '<uses-permission android:name="android.permission.CAMERA"' android/app/src/main/AndroidManifest.xml
            ! grep -q '<uses-permission android:name="android.permission.RECORD_AUDIO"' android/app/src/main/AndroidManifest.xml
            ! grep -q '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"' android/app/src/main/AndroidManifest.xml
            ! grep -q '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"' android/app/src/main/AndroidManifest.xml
            echo '=== APK BUILD ==='
            flutter build apk --debug
          ) > /tmp/CI_LOG.txt 2>&1
          rc=$?
          echo "$rc" > /tmp/CI_EXIT_CODE.txt
          if [ "$rc" -eq 0 ] && [ -f privacy_shield/build/app/outputs/flutter-apk/app-debug.apk ]; then
            cp privacy_shield/build/app/outputs/flutter-apk/app-debug.apk /tmp/PrivacyShield-debug.apk
            sha256sum /tmp/PrivacyShield-debug.apk | sed 's#/tmp/##' > /tmp/APK_SHA256.txt
            stat -c '%s bytes' /tmp/PrivacyShield-debug.apk > /tmp/APK_SIZE.txt
            echo SUCCESS > /tmp/CI_STATUS.txt
          else
            echo FAILED > /tmp/CI_STATUS.txt
          fi
          exit 0

      - name: Publish result to CI branch
        if: always()
        shell: bash
        run: |
          set -e
          git fetch origin privacy-shield-ci
          rm -rf /tmp/privacy-ci-result
          git worktree add --detach /tmp/privacy-ci-result origin/privacy-shield-ci
          cd /tmp/privacy-ci-result
          cp /tmp/CI_LOG.txt CI_LOG.txt || true
          cp /tmp/CI_STATUS.txt CI_STATUS.txt || echo FAILED > CI_STATUS.txt
          cp /tmp/CI_EXIT_CODE.txt CI_EXIT_CODE.txt || echo 99 > CI_EXIT_CODE.txt
          if [ -f /tmp/PrivacyShield-debug.apk ]; then
            cp /tmp/PrivacyShield-debug.apk PrivacyShield-debug.apk
            cp /tmp/APK_SHA256.txt APK_SHA256.txt
            cp /tmp/APK_SIZE.txt APK_SIZE.txt
          else
            rm -f PrivacyShield-debug.apk APK_SHA256.txt APK_SIZE.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f CI_LOG.txt CI_STATUS.txt CI_EXIT_CODE.txt
          if [ -f PrivacyShield-debug.apk ]; then
            git add -f PrivacyShield-debug.apk APK_SHA256.txt APK_SIZE.txt
          else
            git add -u
          fi
          if ! git diff --cached --quiet; then
            git commit -m '[apk] Privacy Shield CI result'
            git push origin HEAD:privacy-shield-ci
          fi

      - name: Enforce build result
        if: always()
        shell: bash
        run: |
          test -f /tmp/CI_EXIT_CODE.txt
          test "$(cat /tmp/CI_EXIT_CODE.txt)" = '0'
          test -f /tmp/PrivacyShield-debug.apk

name: Privacy Shield Android Build

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'privacy-shield-ci' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Install Flutter 3.47
        id: flutter
        continue-on-error: true
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Build, analyze and test
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > CI_LOG.txt
          {
            echo '=== TOOLCHAIN ==='
            flutter --version
            echo '=== DECODE ==='
            rm -rf privacy_shield
            mkdir -p privacy_shield
            base64 -d privacy_shield_source.b64 > /tmp/privacy_shield_source.tgz
            tar -xzf /tmp/privacy_shield_source.tgz -C privacy_shield
            cd privacy_shield
            echo '=== FLUTTER CREATE ==='
            flutter create --platforms=android --org com.privacyshield --project-name privacy_shield .
            rm -f test/widget_test.dart
            mkdir -p android/app/src/main/kotlin/com/privacyshield/privacy_shield
            mkdir -p android/app/src/main/res/xml
            cp native/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            cp native/android/kotlin/*.kt android/app/src/main/kotlin/com/privacyshield/privacy_shield/
            cp native/android/res/xml/*.xml android/app/src/main/res/xml/
            echo '=== PUB GET ==='
            flutter pub get
            echo '=== FORMAT ==='
            dart format lib test
            echo '=== ANALYZE ==='
            flutter analyze --fatal-infos
            echo '=== TEST ==='
            flutter test
            echo '=== SELF SENSOR PERMISSION CHECK ==='
            ! grep -q '<uses-permission android:name="android.permission.CAMERA"' android/app/src/main/AndroidManifest.xml
            ! grep -q '<uses-permission android:name="android.permission.RECORD_AUDIO"' android/app/src/main/AndroidManifest.xml
            ! grep -q '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"' android/app/src/main/AndroidManifest.xml
            echo '=== APK BUILD ==='
            flutter build apk --debug
          } >> CI_LOG.txt 2>&1
          rc=$?
          echo "$rc" > CI_EXIT_CODE.txt
          if [ "$rc" -eq 0 ] && [ -f privacy_shield/build/app/outputs/flutter-apk/app-debug.apk ]; then
            cp privacy_shield/build/app/outputs/flutter-apk/app-debug.apk PrivacyShield-debug.apk
            sha256sum PrivacyShield-debug.apk > APK_SHA256.txt
            echo SUCCESS > CI_STATUS.txt
          else
            echo FAILED > CI_STATUS.txt
          fi
          exit 0
      - name: Commit build result to CI branch
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f CI_LOG.txt CI_STATUS.txt CI_EXIT_CODE.txt || true
          if [ -f PrivacyShield-debug.apk ]; then git add -f PrivacyShield-debug.apk APK_SHA256.txt; fi
          if ! git diff --cached --quiet; then
            git commit -m '[apk] Privacy Shield CI result'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Enforce result
        if: always()
        shell: bash
        run: |
          test -f CI_EXIT_CODE.txt
          test "$(cat CI_EXIT_CODE.txt)" = '0'
          test -f PrivacyShield-debug.apk

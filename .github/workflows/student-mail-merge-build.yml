name: Student Mail Merge - Build APK and Windows

on:
  push:
    branches:
      - 'build/student-mail-merge-20260920'

concurrency:
  group: student-mail-merge-final-build
  cancel-in-progress: true

jobs:
  android:
    name: Test and Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter scaffold
        run: |
          flutter create --platforms=android,windows --org com.mographiccode --project-name student_mail_merge buildapp
          cp student-mail-merge-app/pubspec.yaml buildapp/pubspec.yaml
          rm -rf buildapp/lib buildapp/test buildapp/analysis_options.yaml
          cp -r student-mail-merge-app/lib buildapp/lib
          cp -r student-mail-merge-app/test buildapp/test

      - name: Dependencies
        working-directory: buildapp
        run: flutter pub get

      - name: Patch Arabic RTL PDF renderer
        run: python student-mail-merge-app/tool/patch_htmltopdfwidgets.py

      - name: Analyze
        working-directory: buildapp
        run: flutter analyze --no-fatal-warnings

      - name: Run mail merge tests
        working-directory: buildapp
        run: flutter test --reporter expanded

      - name: Upload Arabic PDF validation sample
        uses: actions/upload-artifact@v4
        with:
          name: Arabic-PDF-Validation
          path: buildapp/arabic_test_output.pdf
          if-no-files-found: warn

      - name: Build release APK
        working-directory: buildapp
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-Mail-Merge-APK
          path: buildapp/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Test and Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Create Flutter scaffold
        shell: pwsh
        run: |
          flutter create --platforms=android,windows --org com.mographiccode --project-name student_mail_merge buildapp
          Copy-Item -Force student-mail-merge-app/pubspec.yaml buildapp/pubspec.yaml
          Remove-Item -Recurse -Force buildapp/lib
          if (Test-Path buildapp/test) { Remove-Item -Recurse -Force buildapp/test }
          if (Test-Path buildapp/analysis_options.yaml) { Remove-Item -Force buildapp/analysis_options.yaml }
          Copy-Item -Recurse student-mail-merge-app/lib buildapp/lib
          Copy-Item -Recurse student-mail-merge-app/test buildapp/test

      - name: Dependencies
        working-directory: buildapp
        run: flutter pub get

      - name: Patch Arabic RTL PDF renderer
        run: python student-mail-merge-app/tool/patch_htmltopdfwidgets.py

      - name: Analyze
        working-directory: buildapp
        run: flutter analyze --no-fatal-warnings

      - name: Run mail merge tests
        working-directory: buildapp
        run: flutter test --reporter expanded

      - name: Build Windows release
        working-directory: buildapp
        run: flutter build windows --release

      - name: Verify Windows release dependencies
        shell: pwsh
        run: |
          $release = "buildapp/build/windows/x64/runner/Release"
          $required = @(
            "student_mail_merge.exe",
            "printing_plugin.dll",
            "flutter_windows.dll",
            "pdfium.dll",
            "dartjni.dll",
            "data"
          )
          foreach ($item in $required) {
            $path = Join-Path $release $item
            if (-not (Test-Path $path)) {
              throw "Missing required Windows runtime file: $item"
            }
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path buildapp/build/windows/x64/runner/Release/* -DestinationPath Student-Mail-Merge-Windows-Portable.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Build Windows installer EXE
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found."
          }
          & $iscc "student-mail-merge-app\installer\student_mail_merge.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed."
          }

      - name: Smoke-test installed application
        shell: pwsh
        run: |
          $installer = Resolve-Path "installer-output\Student-Mail-Merge-Installer-v1.3.1.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "StudentMailMergeInstalled"

          $p = Start-Process $installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=$installDir"
          ) -Wait -PassThru

          if ($p.ExitCode -ne 0) {
            throw "Installer returned exit code $($p.ExitCode)"
          }

          $required = @(
            "student_mail_merge.exe",
            "printing_plugin.dll",
            "flutter_windows.dll",
            "pdfium.dll",
            "dartjni.dll",
            "data"
          )

          foreach ($item in $required) {
            $path = Join-Path $installDir $item
            if (-not (Test-Path $path)) {
              throw "Installer did not install required runtime file: $item"
            }
          }

          $app = Start-Process (Join-Path $installDir "student_mail_merge.exe") -PassThru
          Start-Sleep -Seconds 6

          if ($app.HasExited) {
            throw "Installed application exited during startup with code $($app.ExitCode)"
          }

          Stop-Process -Id $app.Id -Force
          Write-Host "Installed app started successfully with all DLL dependencies present."

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Student-Mail-Merge-Windows-Installer-v1.3.1
          path: installer-output/Student-Mail-Merge-Installer-v1.3.1.exe
          if-no-files-found: error

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: Student-Mail-Merge-Windows-Portable
          path: Student-Mail-Merge-Windows-Portable.zip
          if-no-files-found: error

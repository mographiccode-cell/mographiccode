name: Smart Shipping Android Runtime Gate

on:
  push:
    branches:
      - smart-shipping-runtime-20260822
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-shipping-runtime
  cancel-in-progress: true

jobs:
  quality-build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Restore shipping project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shipping_b64
          cat smart_shipping_ci/part_*.b64 > /tmp/shipping_b64/source.b64
          base64 --decode /tmp/shipping_b64/source.b64 > /tmp/smart_shipping_source.zip
          echo "04c660f7eb14d94c454974ebd83e0a4b1709b87df3dfb7d70a9a1b3fe288759a  /tmp/smart_shipping_source.zip" | sha256sum --check --strict
          rm -rf smart_shipping_compare
          mkdir smart_shipping_compare
          unzip -q /tmp/smart_shipping_source.zip -d smart_shipping_compare
          cd smart_shipping_compare
          flutter create . --platforms=android --org sa.edu.aou --project-name smart_shipping_compare
          rm -f test/widget_test.dart
          python3 tools/prepare_android.py

      - name: Format, analyze, and test
        working-directory: smart_shipping_compare
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          flutter pub get
          flutter analyze --fatal-infos
          flutter test --reporter expanded

      - name: Build release APK
        working-directory: smart_shipping_compare
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: smart_shipping_compare
          script: |
            set -euo pipefail
            APK=build/app/outputs/flutter-apk/app-release.apk
            adb install -r "$APK"
            PACKAGE=sa.edu.aou.smart_shipping_compare
            adb logcat -c
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 6
            test -n "$(adb shell pidof "$PACKAGE" | tr -d '\r')"
            adb logcat -d > /tmp/shipping-logcat.txt
            if grep -A 30 -B 3 'FATAL EXCEPTION' /tmp/shipping-logcat.txt | grep -q "$PACKAGE"; then
              echo "Fatal exception detected for $PACKAGE"
              exit 1
            fi

      - name: Capture APK metadata
        working-directory: smart_shipping_compare
        shell: bash
        run: |
          set -euo pipefail
          sha256sum build/app/outputs/flutter-apk/app-release.apk | tee APK_SHA256.txt
          stat -c '%s bytes' build/app/outputs/flutter-apk/app-release.apk | tee APK_SIZE.txt
          flutter --version | tee FLUTTER_VERSION.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-shipping-android-verified
          path: |
            smart_shipping_compare/build/app/outputs/flutter-apk/app-release.apk
            smart_shipping_compare/APK_SHA256.txt
            smart_shipping_compare/APK_SIZE.txt
            smart_shipping_compare/FLUTTER_VERSION.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload runtime diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smart-shipping-runtime-diagnostics
          path: |
            /tmp/shipping-logcat.txt
            smart_shipping_compare/build/
          if-no-files-found: ignore
          retention-days: 7
